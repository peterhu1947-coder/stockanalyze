<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}StockAnalyze – 投资分析平台{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<!-- ── Navigation ── -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" id="mainNav">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-graph-up-arrow me-2 text-accent"></i>StockAnalyze
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>大盘总览
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'macro' %}active{% endif %}" href="/macro">
            <i class="bi bi-globe2 me-1"></i>宏观分析
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'charts' %}active{% endif %}" href="/charts">
            <i class="bi bi-bar-chart-line me-1"></i>走势图表
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'learn' %}active{% endif %}" href="/learn">
            <i class="bi bi-mortarboard me-1"></i>学习中心
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'advisor' %}active{% endif %}" href="/advisor">
            <i class="bi bi-robot me-1"></i>投资顾问
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── Page content ── -->
<main class="container-fluid px-4 py-4">
  {% block content %}{% endblock %}
</main>

<!-- ── Footer ── -->
<footer class="text-center py-4 mt-4 footer-bar">
  <small class="text-muted">
    © 2025 StockAnalyze &nbsp;|&nbsp;
    <i class="bi bi-exclamation-circle"></i>
    本平台仅供学习参考，不构成投资建议。投资有风险，入市须谨慎。
  </small>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
